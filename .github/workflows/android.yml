name: Build Android (AAB + APK)
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci || npm install
      - run: npx cap sync android
      - name: Build release AAB (unsigned) and debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew bundleRelease assembleDebug --no-daemon
      - name: Publish build outputs to the "builds" branch
        run: |
          mkdir -p /tmp/out
          cp android/app/build/outputs/bundle/release/*.aab /tmp/out/tribus-release-unsigned.aab
          cp android/app/build/outputs/apk/debug/*.apk /tmp/out/tribus-debug.apk
          echo "${GITHUB_SHA}" > /tmp/out/SOURCE_COMMIT.txt
          cd /tmp/out
          git init -q -b builds
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A && git commit -qm "Build ${GITHUB_SHA}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" builds
      - uses: actions/upload-artifact@v4
        with:
          name: tribus-android
          path: /tmp/out
